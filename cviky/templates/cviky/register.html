{% extends "base.html" %}
{% load static %}

{% block title %}Registrace{% endblock %}

{% block content %}
<div class="brand"><img src="{% static 'cviky/icon-192.png' %}" alt="">Cviky</div>
<h1>Registrace</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <p class="hint"><a href="{% url 'privacy' %}">Ochrana osobních údajů</a> – co ukládám a komu to posílám.</p>
  <button type="submit">Vytvořit účet</button>
</form>
{% endblock %}
