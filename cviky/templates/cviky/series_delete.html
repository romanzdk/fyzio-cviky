{% extends "base.html" %}

{% block title %}Smazat sérii{% endblock %}

{% block content %}
<h1>Smazat sérii</h1>
<div class="card">
  <p>Opravdu smazat sérii „{{ series.name }}“?</p>
  <p class="hint">Cviky samotné zůstanou.</p>
</div>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn danger">Smazat</button>
</form>
<a class="btn ghost" href="{% url 'series_list' %}">Zrušit</a>
{% endblock %}
