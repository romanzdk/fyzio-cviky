{% extends "base.html" %}

{% block title %}Smazat cvik{% endblock %}

{% block content %}
<h1>Smazat cvik</h1>
<div class="card">
  <p>Opravdu smazat cvik „{{ exercise.title }}“?</p>
  <p class="hint">Zmizí i ze všech sérií a s ním i historie odkliknutí.</p>
</div>
<form method="post">
  {% csrf_token %}
  <button type="submit" class="btn danger">Smazat</button>
</form>
<a class="btn ghost" href="{% url 'exercise_detail' exercise.pk %}">Zrušit</a>
{% endblock %}
