<form method="post" action="{% url 'toggle' %}">
  {% csrf_token %}
  <input type="hidden" name="exercise" value="{{ exercise.pk }}">
  {% if series %}<input type="hidden" name="series" value="{{ series.pk }}">{% endif %}
  <button type="submit" class="check{% if checked %} on{% endif %}" aria-label="{% if checked %}Zrušit odkliknutí{% else %}Odkliknout{% endif %}: {{ exercise.title }}">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"/></svg>
  </button>
</form>
