<form method="post" action="{% url 'toggle' %}">
  {% csrf_token %}
  <input type="hidden" name="exercise" value="{{ exercise.pk }}">
  {% if series %}<input type="hidden" name="series" value="{{ series.pk }}">{% endif %}
  <button type="submit" class="check{% if checked %} on{% endif %}" aria-pressed="{{ checked|yesno:'true,false' }}" aria-label="Hotovo: {{ exercise.title }}">
    {% include "cviky/check_icon.html" %}
  </button>
</form>
