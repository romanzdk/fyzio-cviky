{% extends "base.html" %}
{% load static %}

{% block title %}Přihlášení{% endblock %}

{% block content %}
<div class="brand"><img src="{% static 'cviky/icon-192.png' %}" alt="">Cviky</div>
<h1>Přihlášení</h1>
<form method="post">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">Přihlásit se</button>
</form>
<p class="hint" style="margin-top: 20px; text-align: center">Nemáš účet? Appka je zatím na pozvánku – <a href="{% url 'home' %}">víc o ní tady</a>.</p>
{% endblock %}
