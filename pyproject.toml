[project]
name = "fyzio-cviky"
version = "0.1.0"
description = "Připomínky fyzioterapeutických cvičení"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dj-database-url>=3.1.2",
    "django>=6.1.3",
    "gunicorn>=27.0.1",
    "httpx>=0.29.0",
    "psycopg[binary]>=3.3.9",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
filterwarnings = ["ignore:No directory at:UserWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ"]
